# Robot de l'app : chaque jour, il récupère les nouvelles sorties et republie le site.
# Il tourne sur les serveurs de GitHub (gratuit), même quand ton ordinateur est éteint.

name: Import des sorties et mise en ligne

on:
  schedule:
    # Heures en UTC : 4h et 15h UTC = 5h et 16h à Paris en hiver (6h et 17h en été).
    - cron: '0 4,15 * * *'
  push:
    branches: [main]
  workflow_dispatch: # bouton « Run workflow » pour lancer un import à la main

permissions:
  contents: write # enregistrer ingest/first_seen.json (mémoire des « nouveautés »)
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Importer les sorties
        run: node ingest/run.mjs

      - name: Mémoriser les nouveautés
        run: |
          git config user.name "sortir-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ingest/first_seen.json
          if ! git diff --cached --quiet; then
            git commit -m "Import du $(TZ=Europe/Paris date '+%d/%m/%Y %Hh%M')"
            git push
          fi

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: public

  publier:
    needs: import
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.essai1.outputs.page_url || steps.essai2.outputs.page_url }}
    steps:
      # Une publication prend ~20 s. Il arrive que GitHub Pages cale (06/11/2026) :
      # on abandonne au bout de 5 min et on retente une fois, avant de déclarer l'échec.
      - name: Publier
        id: essai1
        uses: actions/deploy-pages@v5
        continue-on-error: true
        with:
          timeout: 300000

      - name: Publier (2e essai si GitHub Pages a calé)
        id: essai2
        if: steps.essai1.outcome == 'failure'
        uses: actions/deploy-pages@v5
